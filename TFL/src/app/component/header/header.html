<header class="w-full bg-white border-b border-[#DB9C85]/20">

  <div class="max-w-7xl mx-auto px-6 py-5">

    <nav class="grid grid-cols-3 items-center">

      <!-- Logo -->
      <div class="flex justify-start">

        <a
          href=""
          (click)="$event.preventDefault(); goHome()"
          class="text-2xl font-bold tracking-wide text-[#543B37]">

          The Foodie Leonne

        </a>

      </div>


      <!-- Navigation -->
      <div class="flex items-center justify-center gap-8">

        <a
          href=""
          (click)="$event.preventDefault(); goHome()"
          class="text-[#543B37] font-medium hover:text-[#E56D84] transition">

          Home

        </a>

        <a
          href=""
          (click)="$event.preventDefault(); goAbout()"
          class="text-[#543B37] font-medium hover:text-[#E56D84] transition">

          About

        </a>

        <a
          href=""
          (click)="$event.preventDefault(); goRecipes()"
          class="text-[#543B37] font-medium hover:text-[#E56D84] transition">

          Recipes & Reviews

        </a>

      </div>


      <!-- Search -->
      <div class="flex justify-end">

        <div class="relative">

          <input
            type="search"
            placeholder="Search..."
            class="w-44 px-4 py-2 pr-10 rounded-full
                   border border-[#DB9C85]/30
                   text-sm text-[#543B37]
                   placeholder:text-[#543B37]/50
                   focus:outline-none
                   focus:ring-2
                   focus:ring-[#E56D84]"
          />

          <span
            class="absolute right-4 top-1/2
                   -translate-y-1/2
                   text-[#543B37]/60">

            <i class="fa-solid fa-magnifying-glass"></i>

          </span>

        </div>

      </div>

    </nav>

  </div>

</header>
